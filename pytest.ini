[pytest]
markers =
    smoke: fast, critical-path checks (~5 tests, runs in under 1 minute)
    regression: full functional coverage suite (20+ tests)

testpaths = tests
addopts =
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --output=reports/test-results

filterwarnings =
    ignore::DeprecationWarning

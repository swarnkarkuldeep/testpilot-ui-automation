name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly full regression run at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke suite
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run smoke suite
        run: python -m pytest -m smoke --alluredir=allure-results

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            reports/
            allure-results/
          retention-days: 14

  regression:
    name: Regression suite
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run regression suite
        run: python -m pytest -m regression --alluredir=allure-results

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            reports/
            allure-results/
          retention-days: 14
